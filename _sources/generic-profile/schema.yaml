$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  Generic Process Profile (OGC 14-065 WPS 2.0.2 §7.5.2): "the abstract interface of a process...
  declares a signature for process inputs and outputs." One Generic Profile per signature: several
  operations sharing the identical I/O shape (the seven binary spatial predicates, for instance)
  share one Generic Profile and differ only at Implementation Profile; `broader` links it to the
  Process Concept (generic-profiles.concept.*) documenting the general group it belongs to.

  Implementation Profiles (generic-profiles.implementation-profile.*) refine a Generic Profile
  with the formats it supports. Implementations (instance level) -- concrete, deployable processes
  -- are not part of this register; they live wherever the implementation itself is profiled (e.g.
  `ospd.process-profiles.sqlmm.*`) and link back here via their own `implementsProfile` property.
  This register does not cross-reference them.

  `inputs`/`outputs` use a subset of OGC API - Processes - Part 1: Core's own
  `InputDescription`/`OutputDescription` structure (`title`, `description`, `keywords`,
  `minOccurs`/`maxOccurs`), plus `dataType`, rather than a custom vocabulary invented for this register: this
  project already imports and uses that structure at Implementation (instance level)
  (`ogc.api.processes.part1.v1.schemas.*`), so reusing it here makes all four tiers structurally, not
  just conceptually, consistent. A format is deliberately forbidden at this tier:
  [OGC 14-065 WPS 2.0.2 §7.5.4 Table 21](https://docs.ogc.org/is/14-065/14-065.html#32) gives
  Generic Profile no "Data format" row at all (only Implementation Profile does, "D"). `dataType`
  is not a format: it is a concept of the bblocks-data-types register, the kind of data a role
  takes, not its encoding. What WPS §7.5.2 calls a "signature" is the existence, naming,
  `dataType` and multiplicity of inputs/outputs; `title`/`description` explain them in prose.

  This tier is where Table 21 Declares (D) every property it lists for the Process, its Inputs
  and its Outputs -- including `keywords` (Process, Input, Output) and `metadata` (Input,
  Output), both taken from OGC API - Processes' own `descriptionType` (whose `metadata` item,
  `ogc.api.processes.part1.v1.schemas.metadata`, is WPS Table 5's Metadata structure: `title`, `role`,
  `href`). Profile-level references, with the Table 22 roles, are made once, on the process
  itself: here, to this Generic Profile's superior, its Process Concept
  (`http://www.opengis.net/spec/wps/2.0/def/process-profile/concept`) -- the list Table 21
  footnote a requires the Implementation Profile to extend. An input's or output's own `metadata`
  only ever references the corresponding input/output of a superior profile; a Process Concept
  has none, so at this tier it is declared but normally empty.
allOf:
  - $ref: bblocks://ogc.rim.schemas.register-item
  - type: object
    required: [id, type, prefLabel, definition, inScheme, broader, keywords, metadata, inputs, outputs,
               itemClass, inRegister, hasAction]
    properties:
      id:
        type: string
        format: uri
      type:
        const: GenericProfile
      prefLabel:
        type: string
      definition:
        type: string
      inScheme:
        type: string
        format: uri
      # Pinned per tier; the rest of the ISO 19135:2026 required core comes from rim.registered-item.
      itemClass:
        const: https://geolabs.github.io/bblocks-generic-profiles/def/item-class/generic-profile
      inRegister:
        const: https://geolabs.github.io/bblocks-generic-profiles/def/register
      broader:
        description: The Process Concept(s) (generic-profiles.concept.*) documenting the general group this operation belongs to.
        type: array
        minItems: 1
        items: {type: string, format: uri}
      keywords:
        description: Table 21 Process.Keywords (D). Each Implementation Profile must keep all of them (E).
        type: array
        minItems: 1
        items: {type: string}
      metadata:
        description: >-
          Table 21 Process.Metadata (D): references to superior profiles, with Table 22 roles -- here
          the Process Concept(s) of `broader`.
        type: array
        items: {$ref: bblocks://ogc.api.processes.part1.v1.schemas.metadata}
        contains:
          type: object
          required: [role, href]
          properties:
            role: {const: "http://www.opengis.net/spec/wps/2.0/def/process-profile/concept"}
      source:
        type: array
        items:
          type: object
          required: [title]
          properties:
            title: {type: string}
            link: {type: string, format: uri}
            clause: {type: string}
      inputs:
        description: >-
          Keyed by role name. A subset of OGC API - Processes Part 1 Core's own InputDescription, plus
          `dataType`: `title`/`description` explain the role in prose; `dataType` and
          `minOccurs`/`maxOccurs` (Table 21: Input.Multiplicity, D) are its machine-checkable properties.
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          required: [id, dataType, title, keywords]
          properties:
            dataType:
              description: >-
                What kind of data this input is, as a concept of the bblocks-data-types
                register (`https://geolabs.github.io/bblocks-data-types/def/data-type/...`).
                Not a data format: Table 21 gives this tier none; an Implementation Profile may narrow it
                (e.g. `raster` to `raster-single-band`, `geometry` to `surface`).
              type: string
              format: uri
            id:
              description: This input's own IRI, `<profile id>/inputs/<name>` -- what a lower tier's
                metadata `href` points at.
              type: string
              format: uri
            title: {type: string}
            description: {type: string}
            keywords: {type: array, minItems: 1, items: {type: string}}
            metadata:
              description: >-
                Table 21 Input.Metadata (D). References to the corresponding input of a superior
                profile only; a Process Concept has no inputs, so normally empty at this tier.
              type: array
              items: {$ref: bblocks://ogc.api.processes.part1.v1.schemas.metadata}
            minOccurs: {type: integer, default: 1}
            maxOccurs:
              default: 1
              oneOf:
                - type: integer
                - const: unbounded
      outputs:
        description: >-
          Keyed by role name. No `minOccurs`/`maxOccurs` -- Table 21 has no Output.Multiplicity row
          (and, per the same reasoning as the earlier `cardinality`-on-outputs mistake this replaces,
          an output's internal structure, e.g. a raster's band count, is not an output cardinality
          either way; see generic-profiles.implementation-profile.raster-band-math-multiband's
          `description.md`).
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          required: [id, dataType, title, keywords]
          properties:
            dataType:
              description: >-
                What kind of data this output is, as a concept of the bblocks-data-types
                register (`https://geolabs.github.io/bblocks-data-types/def/data-type/...`).
                Not a data format: Table 21 gives this tier none; an Implementation Profile may narrow it
                (e.g. `raster` to `raster-single-band`, `geometry` to `surface`).
              type: string
              format: uri
            id:
              description: This output's own IRI, `<profile id>/outputs/<name>` -- what a lower tier's
                metadata `href` points at.
              type: string
              format: uri
            title: {type: string}
            description: {type: string}
            keywords: {type: array, minItems: 1, items: {type: string}}
            metadata:
              description: >-
                Table 21 Output.Metadata (D, then O below: no footnote a). As for inputs, normally
                empty at this tier.
              type: array
              items: {$ref: bblocks://ogc.api.processes.part1.v1.schemas.metadata}
