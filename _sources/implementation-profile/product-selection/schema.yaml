$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  The Implementation Profile "Product selection" -- see generic-profiles.implementation-profile for
  the general shape every Implementation Profile shares.
allOf:
  - $ref: bblocks://generic-profiles.implementation-profile
  - type: object
    properties:
      id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/product-selection"}
      type: {const: ImplementationProfile}
      prefLabel: {const: "Product selection"}
      refinesGenericProfile: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/product-selection"}
      activityType: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/product-selection"}
      # Table 21 against product-selection: keywords Extend (E), metadata Extend (E, footnote a), input
      # minOccurs/maxOccurs where declared: at most the Generic Profile's (minOccurs may be 0, maxOccurs Restrict (R)).
      keywords:
        allOf:
        - contains: {const: product}
        - contains: {const: selection}
        - contains: {const: catalogue}
      metadata:
        allOf:
        - contains:
            type: object
            required: [role, href]
            properties:
              role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/concept'}
              href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/concept/data-discovery-and-access'}
        - contains:
            type: object
            required: [role, href]
            properties:
              role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/generic'}
              href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/product-selection'}
      inputs:
        type: object
        required: [areaOfInterest, timeInterval, collection]
        properties:
          areaOfInterest:
            properties:
              keywords:
                allOf:
                - contains: {const: area of interest}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/product-selection/inputs/areaOfInterest'}
          timeInterval:
            properties:
              keywords:
                allOf:
                - contains: {const: time interval}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/product-selection/inputs/timeInterval'}
          collection:
            properties:
              keywords:
                allOf:
                - contains: {const: collection}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/product-selection/inputs/collection'}
      outputs:
        type: object
        required: [products]
        properties:
          products:
            properties:
              keywords:
                allOf:
                - contains: {const: product}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-output'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/product-selection/outputs/products'}
  - type: object
    properties:
      inputs:
        properties:
          areaOfInterest: {required: [id, dataType, representation], properties: {id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/product-selection/inputs/areaOfInterest"}, dataType: {const: "https://geolabs.github.io/bblocks-data-types/def/data-type/geometry"}, representation: {const: ["https://w3id.org/geolabs/ospd/data-formats/representation/geometry-geojson"]}}}
          timeInterval: {required: [id, dataType], properties: {id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/product-selection/inputs/timeInterval"}, dataType: {const: "https://geolabs.github.io/bblocks-data-types/def/data-type/time-interval"}}}
          collection: {required: [id, dataType], properties: {id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/product-selection/inputs/collection"}, dataType: {const: "https://geolabs.github.io/bblocks-data-types/def/data-type/collection-identifier"}}}
      outputs:
        properties:
          products: {required: [id, dataType, representation], properties: {id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/product-selection/outputs/products"}, dataType: {const: "https://geolabs.github.io/bblocks-data-types/def/data-type/eo-product"}, representation: {const: ["https://w3id.org/geolabs/ospd/data-formats/representation/eo-product-stac-item"]}}}
