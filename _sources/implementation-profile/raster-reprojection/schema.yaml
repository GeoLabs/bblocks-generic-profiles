$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  The Implementation Profile "Raster reprojection" -- see generic-profiles.implementation-profile for
  the general shape every Implementation Profile shares.
allOf:
  - $ref: bblocks://generic-profiles.implementation-profile
  - type: object
    properties:
      id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/raster-reprojection"}
      type: {const: ImplementationProfile}
      prefLabel: {const: "Raster reprojection"}
      refinesGenericProfile: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/raster-reprojection"}
      # Table 21 against raster-reprojection: keywords Extend (E), input metadata Extend (E, footnote a),
      # input maxOccurs Restrict (R).
      keywords:
        allOf:
        - contains: {const: raster}
        - contains: {const: coverage}
        - contains: {const: reprojection}
      inputs:
        type: object
        required: [raster, targetCRS]
        properties:
          raster:
            properties:
              keywords:
                allOf:
                - contains: {const: raster}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/concept'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/concept/raster-coverage-processing'}
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/generic'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/raster-reprojection'}
              maxOccurs: {type: integer, maximum: 1}
          targetCRS:
            properties:
              keywords:
                allOf:
                - contains: {const: CRS}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/concept'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/concept/raster-coverage-processing'}
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/generic'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/raster-reprojection'}
              maxOccurs: {type: integer, maximum: 1}
      outputs:
        type: object
        required: [raster]
        properties:
          raster:
            properties:
              keywords:
                allOf:
                - contains: {const: raster}
