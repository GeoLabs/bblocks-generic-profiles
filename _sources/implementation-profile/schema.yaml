$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  Process Implementation Profile (OGC 14-065 WPS 2.0.2 §7.5.3): "Implementation profiles cover
  all descriptive elements of a process down to the supported data exchange formats." One per
  specific named operation (Intersects, Buffer, ...), `refinesGenericProfile` to exactly one
  Generic Profile (the shared abstract I/O shape).

  `inputs`/`outputs` name Table 21's Data format (D) by reference: `representation`, one or more
  IRIs of representations of the bblocks-data-formats register (decision D6, 2026-11-05). A
  representation realizes a version of a data type of bblocks-data-types and points to one format
  (GML, GeoTIFF, LAS, the OGC API - Processes bbox, ...). The JSON Schema that a real deployment
  serves stays at the Implementation (instance level), as its processDescription's `schema`; it is
  not copied here. `maxOccurs`, when present, Restricts (R, footnote c: "Implementation profiles may
  restrict the maximum cardinality of a superior generic profile... They shall not modify the
  minimum cardinality") the Generic Profile's own value -- a real integer (or `unbounded`), not
  free text. Only inputs/outputs that carry spatial, raster, point cloud or bbox data have a
  representation; a plain parameter (an expression, a CRS, a distance) has none to declare.

  Keep the declared representations minimal and deliberately not exhaustive (one is often enough).
  Per Table 21, Implementation (instance level) may *Extend* this (footnote d: "Implementations
  may... support additional data exchange formats").

  The meaning of the operation is not here: it is the activity type that `activityType` points to
  (generic-profiles.activity-type.*, decisions D3 and D4). No tool, host or testbed is named at this
  tier.

  The rest of Table 21 at this tier, as each real Implementation Profile's own `schema.yaml`
  enforces it against its Generic Profile:
  - Process: `keywords` Extend (E) -- must contain every Generic Profile keyword;
    `id`/`prefLabel`/`definition` Override (O); `metadata` Extends (E, footnote a: "the list of
    metadata references to superior process profiles shall be extended") the Generic Profile's
    list -- its Table 22 `concept` reference -- with a `generic` one to the Generic Profile
    itself. Profile-level references are made here only, never repeated on inputs/outputs.
  - Input: every Generic Profile input is listed. Its `metadata` references the corresponding
    Generic Profile input (`<Generic Profile id>/inputs/<name>`) with this register's role
    `https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input` -- footnote a, at the level of the input; `keywords` Extend (E);
    Identifier/Title/Abstract Inherit (I), so not repeated; `maxOccurs` Restrict (R); `minOccurs`
    may be restricted down to 0 (a register choice beyond Table 21, footnote c forbidding it);
    `representation` Declare (D).
  - Output: every Generic Profile output is listed too; `metadata` references the corresponding
    Generic Profile output with the role `https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-output` (Table 21 allows any value here,
    O; the register keeps outputs symmetric with inputs); `keywords` Extend (E); `representation`
    Declare (D).
allOf:
  - $ref: bblocks://ogc.rim.schemas.register-item
  - type: object
    required: [id, type, prefLabel, definition, inScheme, refinesGenericProfile, activityType, keywords, metadata,
               inputs, outputs, itemClass, inRegister, hasAction]
    properties:
      id:
        type: string
        format: uri
      type:
        const: ImplementationProfile
      prefLabel:
        type: string
      definition:
        type: string
      inScheme:
        type: string
        format: uri
      # Pinned per tier; the rest of the ISO 19135:2026 required core comes from rim.registered-item.
      itemClass:
        const: https://geolabs.github.io/bblocks-generic-profiles/def/item-class/implementation-profile
      inRegister:
        const: https://geolabs.github.io/bblocks-generic-profiles/def/register
      refinesGenericProfile:
        description: The single Generic Profile (generic-profiles.generic-profile.*) this Implementation Profile refines.
        type: string
        format: uri
      activityType:
        description: >-
          The activity type (generic-profiles.activity-type.*) that holds the meaning of the operation
          this Implementation Profile binds to formats (decisions D3 and D4). gp:activityType, a
          sub-property of rim:relatedItem.
        type: string
        format: uri
        pattern: ^https://geolabs\.github\.io/bblocks-generic-profiles/def/activity-type/[a-z0-9-]+$
      keywords:
        description: Table 21 Process.Keywords (E) -- the Generic Profile's keywords plus this operation's own.
        type: array
        minItems: 1
        items: {type: string}
      metadata:
        description: >-
          Table 21 Process.Metadata (E, footnote a): the Generic Profile's references (Table 22
          `concept`) plus a Table 22 `generic` reference to the Generic Profile.
        type: array
        items: {$ref: bblocks://ogc.api.processes.part1.v1.schemas.metadata}
        allOf:
          - contains:
              type: object
              required: [role, href]
              properties:
                role: {const: "http://www.opengis.net/spec/wps/2.0/def/process-profile/concept"}
          - contains:
              type: object
              required: [role, href]
              properties:
                role: {const: "http://www.opengis.net/spec/wps/2.0/def/process-profile/generic"}
      inputs:
        description: >-
          Keyed by the same input names as the Generic Profile's own `inputs` (Identifier/Title/
          Abstract Inherited, not repeated). `representation` is Table 21's Data format (D); `maxOccurs`,
          when present, Restricts (R, footnote c) the Generic Profile's own value; `keywords` Extend
          (E) the Generic Profile's; `metadata` Extends (E, footnote a) its superior-profile
          references.
        type: object
        additionalProperties:
          type: object
          required: [id, dataType, keywords, metadata]
          not: {required: [schema]}
          properties:
            dataType:
              description: >-
                What kind of data this input is, as a concept of the bblocks-data-types
                register (`https://geolabs.github.io/bblocks-data-types/def/data-type/...`).
                The Generic Profile's, or a narrower one (`skos:broader` chain): e.g. a band-count or a
                geometry-type restriction.
              type: string
              format: uri
            id:
              description: This input's own IRI, `<profile id>/inputs/<name>` -- what a lower tier's
                metadata `href` points at.
              type: string
              format: uri
            representation:
              description: >-
                Table 21 Data format (D), by reference (decision D6): one or more representations of
                the bblocks-data-formats register
                (`https://w3id.org/geolabs/ospd/data-formats/representation/...`), each realizing a
                version of this role's dataType, or of a broader one, and pointing to one format. No
                copied schema: the schema stays at the Implementation (instance level), as served.
              type: array
              minItems: 1
              items:
                type: string
                format: uri
                pattern: ^https://w3id\.org/geolabs/ospd/data-formats/representation/[a-z0-9-]+$
            minOccurs:
              description: >-
                Restricts the Generic Profile's minimum, down to 0 (the input becomes optional),
                never above it. A deliberate departure from Table 21 footnote c ("shall not modify
                the minimum cardinality"): a Generic Profile keeps `minOccurs: 1` and lower tiers,
                down to a real implementation, may make the input optional (e.g. a target CRS whose
                absence means no reprojection).
              type: integer
              minimum: 0
            maxOccurs:
              oneOf:
                - type: integer
                - const: unbounded
            keywords: {type: array, minItems: 1, items: {type: string}}
            metadata:
              type: array
              items: {$ref: bblocks://ogc.api.processes.part1.v1.schemas.metadata}
              contains:
                type: object
                required: [role, href]
                properties:
                  role: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input"}
      outputs:
        description: Keyed by the same output names as the Generic Profile's own `outputs`.
        type: object
        additionalProperties:
          type: object
          required: [id, dataType, keywords, metadata]
          not: {required: [schema]}
          properties:
            dataType:
              description: >-
                What kind of data this output is, as a concept of the bblocks-data-types
                register (`https://geolabs.github.io/bblocks-data-types/def/data-type/...`).
                The Generic Profile's, or a narrower one (`skos:broader` chain): e.g. a band-count or a
                geometry-type restriction.
              type: string
              format: uri
            id:
              description: This output's own IRI, `<profile id>/outputs/<name>` -- what a lower tier's
                metadata `href` points at.
              type: string
              format: uri
            representation:
              description: >-
                Table 21 Data format (D), by reference (decision D6): one or more representations of
                the bblocks-data-formats register
                (`https://w3id.org/geolabs/ospd/data-formats/representation/...`), each realizing a
                version of this role's dataType, or of a broader one, and pointing to one format. No
                copied schema: the schema stays at the Implementation (instance level), as served.
              type: array
              minItems: 1
              items:
                type: string
                format: uri
                pattern: ^https://w3id\.org/geolabs/ospd/data-formats/representation/[a-z0-9-]+$
            keywords: {type: array, minItems: 1, items: {type: string}}
            metadata:
              type: array
              items: {$ref: bblocks://ogc.api.processes.part1.v1.schemas.metadata}
              contains:
                type: object
                required: [role, href]
                properties:
                  role: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-output"}
      source:
        type: array
        items:
          type: object
          required: [title]
          properties:
            title: {type: string}
            link: {type: string, format: uri}
