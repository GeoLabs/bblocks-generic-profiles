$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  The Implementation Profile "Centroid" -- see generic-profiles.implementation-profile for
  the general shape every Implementation Profile shares.
allOf:
  - $ref: bblocks://generic-profiles.implementation-profile
  - type: object
    properties:
      id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/centroid"}
      type: {const: ImplementationProfile}
      prefLabel: {const: "Centroid"}
      refinesGenericProfile: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/unary-geometry-operation"}
      # Table 21 against unary-geometry-operation: keywords Extend (E), metadata Extend
      # (E, footnote a: Table 22 references on the process, input/output-level ones below),
      # input maxOccurs Restrict (R).
      keywords:
        allOf:
        - contains: {const: vector}
        - contains: {const: geometry}
        - contains: {const: derived geometry}
      metadata:
        allOf:
        - contains:
            type: object
            required: [role, href]
            properties:
              role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/concept'}
              href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/concept/vector-geometry-processing'}
        - contains:
            type: object
            required: [role, href]
            properties:
              role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/generic'}
              href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/unary-geometry-operation'}
      inputs:
        type: object
        required: [geometry]
        properties:
          geometry:
            properties:
              keywords:
                allOf:
                - contains: {const: geometry}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/unary-geometry-operation/inputs/geometry'}
              maxOccurs: {type: integer, maximum: 1}
      outputs:
        type: object
        required: [result]
        properties:
          result:
            properties:
              keywords:
                allOf:
                - contains: {const: geometry}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-output'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/unary-geometry-operation/outputs/result'}
  - type: object
    properties:
      inputs:
        properties:
          geometry: {required: [id], properties: {id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/centroid/inputs/geometry"}}}
      outputs:
        properties:
          result: {required: [id], properties: {id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/centroid/outputs/result"}}}
