$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  The Implementation Profile "Centroid" -- see generic-profiles.implementation-profile for
  the general shape every Implementation Profile shares.
allOf:
  - $ref: bblocks://generic-profiles.implementation-profile
  - type: object
    properties:
      id: {const: "https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/centroid"}
      type: {const: ImplementationProfile}
      prefLabel: {const: "Centroid"}
      refinesGenericProfile: {const: "https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/unary-geometry-operation"}
      activityType: {const: "https://w3id.org/geolabs/ospd/generic-profiles/activity-type/centroid"}
      # Table 21 against unary-geometry-operation: keywords Extend (E), metadata Extend
      # (E, footnote a: Table 22 references on the process, input/output-level ones below),
      # input minOccurs/maxOccurs, where declared: at most the Generic Profile's (minOccurs may be 0,
      # maxOccurs Restrict (R)).
      keywords:
        allOf:
        - contains: {const: vector}
        - contains: {const: geometry}
        - contains: {const: derived geometry}
      metadata:
        allOf:
        - contains:
            type: object
            required: [role, href]
            properties:
              role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/concept'}
              href: {const: 'https://w3id.org/geolabs/ospd/generic-profiles/concept/vector-geometry-processing'}
        - contains:
            type: object
            required: [role, href]
            properties:
              role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/generic'}
              href: {const: 'https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/unary-geometry-operation'}
      inputs:
        type: object
        required: [geometry]
        properties:
          geometry:
            properties:
              keywords:
                allOf:
                - contains: {const: geometry}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'https://w3id.org/geolabs/ospd/generic-profiles/role/generic-input'}
                      href: {const: 'https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/unary-geometry-operation/inputs/geometry'}
      outputs:
        type: object
        required: [result]
        properties:
          result:
            properties:
              keywords:
                allOf:
                - contains: {const: geometry}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'https://w3id.org/geolabs/ospd/generic-profiles/role/generic-output'}
                      href: {const: 'https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/unary-geometry-operation/outputs/result'}
  - type: object
    properties:
      inputs:
        properties:
          geometry: {required: [id, dataType, representation], properties: {id: {const: "https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/centroid/inputs/geometry"}, dataType: {const: "https://w3id.org/geolabs/ospd/data-types/data-type/surface"}, representation: {const: ["https://w3id.org/geolabs/ospd/data-formats/representation/surface-gml"]}}}
      outputs:
        properties:
          result: {required: [id, dataType, representation], properties: {id: {const: "https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/centroid/outputs/result"}, dataType: {const: "https://w3id.org/geolabs/ospd/data-types/data-type/point"}, representation: {const: ["https://w3id.org/geolabs/ospd/data-formats/representation/point-gml"]}}}
