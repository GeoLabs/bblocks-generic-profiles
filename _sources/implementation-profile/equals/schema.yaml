$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  The Implementation Profile "Equals" -- see generic-profiles.implementation-profile for
  the general shape every Implementation Profile shares.
allOf:
  - $ref: bblocks://generic-profiles.implementation-profile
  - type: object
    properties:
      id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/equals"}
      type: {const: ImplementationProfile}
      prefLabel: {const: "Equals"}
      refinesGenericProfile: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/binary-spatial-predicate"}
      # Table 21 against binary-spatial-predicate: keywords Extend (E), metadata Extend
      # (E, footnote a: Table 22 references on the process, input/output-level ones below),
      # input maxOccurs Restrict (R).
      keywords:
        allOf:
        - contains: {const: vector}
        - contains: {const: geometry}
        - contains: {const: spatial relation}
        - contains: {const: predicate}
      metadata:
        allOf:
        - contains:
            type: object
            required: [role, href]
            properties:
              role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/concept'}
              href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/concept/vector-geometry-processing'}
        - contains:
            type: object
            required: [role, href]
            properties:
              role: {const: 'http://www.opengis.net/spec/wps/2.0/def/process-profile/generic'}
              href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/binary-spatial-predicate'}
      inputs:
        type: object
        required: [geometry1, geometry2]
        properties:
          geometry1:
            properties:
              keywords:
                allOf:
                - contains: {const: geometry}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/binary-spatial-predicate/inputs/geometry1'}
              maxOccurs: {type: integer, maximum: 1}
          geometry2:
            properties:
              keywords:
                allOf:
                - contains: {const: geometry}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/binary-spatial-predicate/inputs/geometry2'}
              maxOccurs: {type: integer, maximum: 1}
      outputs:
        type: object
        required: [result]
        properties:
          result:
            properties:
              keywords:
                allOf:
                - contains: {const: boolean}
              metadata:
                allOf:
                - contains:
                    type: object
                    required: [role, href]
                    properties:
                      role: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-output'}
                      href: {const: 'https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/binary-spatial-predicate/outputs/result'}
  - type: object
    properties:
      inputs:
        properties:
          geometry1: {required: [id], properties: {id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/equals/inputs/geometry1"}}}
          geometry2: {required: [id], properties: {id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/equals/inputs/geometry2"}}}
      outputs:
        properties:
          result: {required: [id], properties: {id: {const: "https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/equals/outputs/result"}}}
