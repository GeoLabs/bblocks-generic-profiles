# Register configuration for bblocks-generic-profiles
# Structure follows GeoLabs/bblocks-process-profiles / GeoLabs/bblocks-eoap-cct.

identifier-prefix: generic-profiles.

name: Generic Process Profiles

abstract: |
  A general-purpose, provider-independent vocabulary of process Concepts, Generic Profiles and
  Implementation Profiles, the first three tiers of OGC 14-065 WPS 2.0.2 §7.5, independent of any
  one project. The tiers differ in what they may carry: a Process Concept documents a general group
  of processes, with no input or output; a Generic Profile gives one or more related operations an
  abstract I/O signature (named roles, `dataType` concepts, multiplicity; no format, no size limit),
  e.g. every binary boolean spatial predicate (Intersects, Contains, Within, Touches, Crosses,
  Equals, Disjoint) takes two geometry inputs and returns one boolean, and is one Generic Profile,
  not seven; an Implementation Profile refines one Generic Profile with the exchange formats it
  supports, for any provider to implement. Real deployed or deployable processes, the fourth tier,
  are not part of this register; they live wherever the implementation itself is profiled (e.g.
  `ospd.process-profiles.*` for OSPD's CWL- and OGC-API-Processes-sourced profiles) and link back
  here via their own `implementsProfile` property.

description: |
  Produced by GeoLabs, first grounded in the spatial predicates and set operations of OGC Simple
  Feature Access - Common Architecture (06-103r4) as a worked example: they share a small number of
  I/O shapes, so the Generic Profile layer stays small. SQL/MM Spatial (ISO/IEC 13249-3) binds the
  same operations to SQL (the `ST_Geometry` type, `ST_Intersects`-style function names) and is
  profiled here, at the Implementation Profile tier; real deployed processes bind them further
  still (e.g. to GML 3.1.0 Polygon) and are profiled in whichever register profiles the concrete
  process (e.g. `ospd.process-profiles.*`), linked back here by `implementsProfile`.
  Not limited to spatial operations -- any domain with standardised abstract operations and several
  independent bindings is a candidate.

contact:
  name: GeoLabs SARL
  url: https://www.geolabs.fr/

version: 0.1.0

baseURL: https://geolabs.github.io/bblocks-generic-profiles/
gitHubBaseURL: https://github.com/GeoLabs/bblocks-generic-profiles/

keywords:
  - generic profile
  - SKOS
  - SQL/MM
  - Simple Feature Access
  - process profile

imports:
  - default
  # OGC API - Processes - Part 1: Core schemas: the Table 22 `metadata` structure every tier uses
  # (ogc.api.processes.v1.schemas.metadata). Formats are no longer copied as `schema` at tier 3: an
  # Implementation Profile names representations of bblocks-data-formats (decision D6, 2026-11-09).
  - https://geolabs.github.io/bblocks-ogcapi-processes/build/register.json
  # Registered Item Model (ISO 19135:2026) -- this register's governance layer: every Concept,
  # Generic Profile and Implementation Profile is a rim:RegisterItem of one of three
  # rim:RegisterItemClasses (generic-profiles.register), and each tier's base schema allOf-references
  # ogc.rim.schemas.register-item (the model's JSON binding, contributed by GeoLabs, published
  # upstream since 2026-10-28).
  - https://ogcincubator.github.io/registered-item-model/build/register.json
  # Data types (ISO 19135:2026 concept plane): every `dataType` IRI of a Generic or Implementation
  # Profile input/output is a concept of this register (data-types.data-type.*).
  - https://geolabs.github.io/bblocks-data-types/build/register.json
  # Data formats (content plane, decision D6): every `representation` IRI of an Implementation
  # Profile input/output is a df:Representation of this register (data-formats.representation.*),
  # which realizes a version of the role's data type and points to a df:Format.
  - https://geolabs.github.io/bblocks-data-formats/build/register.json
  # Activity Type Register: each operation's meaning is an acttype:ActivityType item of this
  # register (generic-profiles.activity-type.*), and each Implementation Profile links to it with
  # `activityType`, a sub-property of rim:relatedItem. Imported from ogcincubator, not
  # geonovum-labs.
  - https://ogcincubator.github.io/activity-type-register/build/register.json

schema-oas30-downcompile: False

