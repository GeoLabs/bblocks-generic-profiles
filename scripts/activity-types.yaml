- key: disjoint
  prefLabel: Disjoint
  altLabel:
  - ST_Disjoint
  definition: Returns TRUE if this geometric object is spatially disjoint from anotherGeometry (they share
    no point). Equivalent to the negation of Intersects.
  parent: geoprocessing
  usedEntityType:
  - geo:Geometry
  sources:
