  illustration: '![ST_Within](assets/st_within.png)


    This diagram illustrates `ST_Within`, not `ST_Contains` directly -- PostGIS''s own workshop does not
    give `ST_Contains` a separate figure, since the two predicates are logical inverses of one another
    (reading the diagram the other way around, with the roles of the two geometries swapped, illustrates
    `Contains`).


    Source: [PostGIS Workshop -- Spatial Relationships](https://postgis.net/workshops/postgis-intro/spatial_relationships.html),
    © Paul Ramsey, Mark Leslie, PostGIS contributors, licensed [CC BY-SA 3.0 US](http://creativecommons.org/licenses/by-sa/3.0/us/).'
