- key: is-simple
  prefLabel: Is simple
  altLabel:
  - ST_IsSimple
  definition: Returns 1 (TRUE) if this Geometry has no anomalous geometric points, such as self intersection
    or self tangency.
  parent: geoprocessing
  usedEntityType:
  - geo:Geometry
  sources:
  - title: OGC 99-049 OpenGIS Simple Features Specification For SQL, Revision 1.1, §2.1.1.1 IsSimple()
    link: https://www.ogc.org/standards/sfs/
  - title: 'ISO/IEC 13249-3:2016 SQL multimedia and application packages -- Part 3: Spatial, ST_IsSimple'
- key: otsu-thresholding
  added: '2026-11-10'
  prefLabel: Otsu thresholding
  definition: Divides the cells of a single-band raster into two classes at the threshold computed from the
    histogram of the cell values by Otsu's method, which maximises the variance between the two classes,
    and returns the cells of the upper class as a binary mask.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
  note: The method is the one of N. Otsu, A Threshold Selection Method from Gray-Level Histograms, IEEE
    Transactions on Systems, Man, and Cybernetics 9(1), 1979, 62-66, DOI 10.1109/TSMC.1979.4310076 (record
    checked on Crossref on 2026-11-10). Its text is not openly available and was not read, so it is not
    given as a source.
- key: point-cloud-thinning
  prefLabel: Point cloud thinning (simple)
  definition: Reduces the number of points to the given percentage by sequential point removal, which
    suits points stored in chronological order best.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
- key: point-cloud-to-grid
  prefLabel: Point cloud to grid
  definition: Writes one value per grid cell from the points falling in it -- by default the z value of
    the first point -- as a single-band raster.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
- key: point-cloud-to-shapes
  prefLabel: Point cloud to shapes
  definition: Converts a point cloud to a feature collection of points.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:FeatureCollection
- key: product-selection
  added: '2026-11-10'
  prefLabel: Product selection
  definition: Selects, from a catalogue of Earth observation products, those of a collection whose footprint
    intersects an area of interest and whose acquisition time falls within a time interval, possibly
    filtered further on their metadata, such as their cloud cover.
  parent: geoprocessing
  usedEntityType:
  - geo:Geometry
  generatedEntityType:
  - geo:Feature
  sources:
  - title: OGC 13-026r9 OpenSearch Extension for Earth Observation 1.1, §1 Scope and the parameters for the
      discovery of products (parentIdentifier, cloudCover)
    link: https://docs.ogc.org/is/13-026r9/13-026r9.html
  - title: 'OGC 17-069r4 OGC API - Features - Part 1: Core, §7.15.3 Parameter bbox and §7.15.4 Parameter
      datetime'
    link: https://docs.ogc.org/is/17-069r4/17-069r4.html
  - title: STAC API - Item Search 1.0.0 (community specification), parameters bbox, intersects, datetime and
      collections
    link: https://github.com/radiantearth/stac-api-spec/blob/v1.0.0/item-search/README.md
  note: It passes the geoprocessing shapes through its area of interest, and the search is a spatial query (a
    footprint intersects an area), but nothing geographic is computed or produced; the products may be
    returned as references. Whether a parent for discovery and access outside geoprocessing should be used is
    asked to the maintainers (question 5, decision C10 of 2026-11-10).
- key: radiometric-index
  prefLabel: Radiometric index
  profiles:
  - radiometric-index
  - radiometric-index-single-band
  definition: Computes one or more named radiometric indices (e.g. NDVI, NDWI, SAVI) from the relevant
    spectral channels of the input raster(s).
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
  sources:
  - title: OGC 08-068r2 Web Coverage Processing Service (WCPS) Language Interface Standard
    link: https://www.ogc.org/standards/wcps/
- key: raster-band-math
  prefLabel: Raster band math
  definition: Evaluates a user-supplied mathematical expression per pixel across one or more input rasters,
    producing a monoband output raster.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
  sources:
  - title: OGC 08-068r2 Web Coverage Processing Service (WCPS) Language Interface Standard
    link: https://www.ogc.org/standards/wcps/
- key: raster-band-math-multiband
  prefLabel: Raster band math (multi-band output)
  definition: Evaluates a user-supplied, possibly vector-valued mathematical expression per pixel across
    one or more input rasters, producing an output raster with one or more bands.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
  sources:
  - title: OGC 08-068r2 Web Coverage Processing Service (WCPS) Language Interface Standard
    link: https://www.ogc.org/standards/wcps/
  - title: OGC 09-146r8 Coverage Implementation Schema (CIS) 1.1.1, §6.5 RangeType
    link: https://docs.ogc.org/is/09-146r8/09-146r8.html
- key: raster-crop
  prefLabel: Raster crop
  definition: Extracts the pixels of a raster coverage that fall within a region of interest.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
  sources:
  - title: OGC 08-068r2 Web Coverage Processing Service (WCPS) Language Interface Standard
    link: https://www.ogc.org/standards/wcps/
- key: raster-extent
  prefLabel: Raster extent
  definition: Computes the bounding envelope of a raster coverage, as a vector polygon.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Geometry
  sources:
  - title: OGC 08-068r2 Web Coverage Processing Service (WCPS) Language Interface Standard
    link: https://www.ogc.org/standards/wcps/
- key: raster-format-conversion
  prefLabel: Raster format conversion
  definition: Re-encodes a raster coverage into another raster format, without altering its content.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
  sources:
  - title: OGC 08-068r2 Web Coverage Processing Service (WCPS) Language Interface Standard
    link: https://www.ogc.org/standards/wcps/
- key: raster-rendering
  added: '2026-11-10'
  prefLabel: Raster rendering
  definition: Depicts a raster as an image for viewing, giving each cell a colour from a colour map that
    associates values, or classes of values, with colours.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  sources:
  - title: OGC 05-077r4 Symbology Encoding Implementation Specification 1.1.0, §11.5 Raster Symbolizer
      (ColorMap with the Categorize or Interpolate function)
    link: https://portal.ogc.org/files/05-077r4
  note: No generated entity type is declared. The image holds colours, not values, and is not georeferenced in
    general; no GeoSPARQL class applies to it.
- key: raster-reprojection
  prefLabel: Raster reprojection
  definition: Reprojects a raster coverage to another coordinate reference system, resampling pixel values
    as needed, preserving the coverage's content.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
  sources:
  - title: OGC 08-068r2 Web Coverage Processing Service (WCPS) Language Interface Standard
    link: https://www.ogc.org/standards/wcps/
- key: raster-resampling
  added: '2026-11-10'
  prefLabel: Raster resampling
  definition: Changes the cell size of a raster coverage, or its number of cells along each axis, over the
    same extent and in the same coordinate reference system, computing each new cell value from the input
    cells by an interpolation method.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
  sources:
  - title: OGC 12-039 Web Coverage Service Interface Standard - Scaling Extension 1.0, §4.1 Scaling (of a grid
      coverage)
    link: https://portal.ogc.org/files/12-039
- key: slope
  prefLabel: Slope
  definition: The slope gradient of an elevation model at each cell, from a local fit of the surface by
    the 9 parameter 2nd order polynom of Zevenbergen & Thorne (1987).
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
  sources:
  - title: 'Zevenbergen, L.W., Thorne, C.R. (1987): Quantitative analysis of land surface topography.
      Earth Surface Processes and Landforms, 12: 47-56'
- key: symdifference
  prefLabel: Symmetric difference
