# One activity type per operation (decision D3, 2026-11-05): the meaning of the operation that an
# Implementation Profile binds to representations. scripts/activity_types.py generates
# _sources/activity-type/<key>/ from this file; edit here, then regenerate.
#
# key: the operation. One activity type per operation (decision D3); several Implementation Profiles may
#   point to it (decision C4 of 2026-11-10).
# profiles: the Implementation Profiles that point to it, when they are not just the one named like the
#   operation (radiometric-index: radiometric-index and radiometric-index-single-band).
# added: the date of its addition, when not 2026-11-09.
# note: a paragraph of the description, e.g. why a source is missing.
# parent: geoprocessing, for all 36 (rdfs:subClassOf geoproc:GeoprocessingActivityType, decision of
#   2026-11-09): geoproc requires at least one used or generated entity type that is, or
#   specialises, a GeoSPARQL 1.1 spatial class.
# usedEntityType / generatedEntityType: a GeoSPARQL class chosen per kind of role, directly, with no
#   bridge from the data-types concepts (that bridge is question 5 to the maintainers, still open):
#   geometry, surface, point -> geo:Geometry; bounding-box -> geo:Geometry (the range of
#   geo:hasBoundingBox); raster, raster-single-band, elevation-model -> geo:Feature (a coverage
#   described as a feature, as geoproc:GeoprocessingActivityType says and the ATR NDVI example does);
#   point-cloud -> geo:Feature (a point cloud dataset, described as a feature like a coverage);
#   feature-collection -> geo:FeatureCollection; binary-mask -> geo:Feature (a raster); eo-product ->
#   geo:Feature (a product, described by a record with a footprint). Number, boolean, rendered-image
#   (a picture, not georeferenced in general) and the other non-spatial roles get none. The ATR JSON
#   schema allows one value per property: raster-crop and band-retrieval, which use a raster or a
#   product and a bounding box, declare geo:Feature only; product-selection, whose spatial input is
#   its area of interest, declares geo:Geometry as used type.
# altLabel: the SQL/MM name of the operation, where there is one.
# sources: the standards and literature that define the operation. Tools and deployments are not
#   sources of an operation: they are at tier 4 (bblocks-process-profiles).
# illustration: Markdown, with images under the block's assets/.
- key: analytical-hillshading
  prefLabel: Analytical hillshading
  definition: For each cell, the angle at which light coming from the position of the light source hits
    the terrain surface.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
- key: area
  prefLabel: Area
  altLabel:
  - ST_Area
  definition: The area of this Surface, as measured in the spatial reference system of this Surface.
  parent: geoprocessing
  usedEntityType:
  - geo:Geometry
  sources:
