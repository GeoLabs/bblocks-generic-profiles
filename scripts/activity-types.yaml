    link: https://www.ogc.org/standards/sfs/
  - title: 'ISO/IEC 13249-3:2016 SQL multimedia and application packages -- Part 3: Spatial, ST_Area'
- key: band-retrieval
  added: '2026-11-10'
  prefLabel: Band retrieval
  definition: Retrieves one band, one range component, of an Earth observation product as a raster, over
    the whole product or over an area of interest, with the values the product provides, possibly converted
    to physical units by the scale and offset the product declares.
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
  sources:
  - title: OGC 12-040 Web Coverage Service Interface Standard - Range Subsetting Extension 1.0, §1 Scope
      (retrieval of selected range components of a coverage)
    link: https://portal.ogc.org/files/12-040
