  parent: geoprocessing
  usedEntityType:
  - geo:Geometry
  generatedEntityType:
  - geo:Geometry
  sources:
  - title: 'OGC 06-103r4 Simple Feature Access - Part 1: Common Architecture, §6.1.24'
