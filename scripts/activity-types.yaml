    link: https://www.ogc.org/standards/sfa/
  - title: 'ISO/IEC 13249-3:2016 SQL multimedia and application packages -- Part 3: Spatial, §5.1.14 ST_Disjoint'
  illustration: '![ST_Disjoint](assets/st_disjoint.png)


