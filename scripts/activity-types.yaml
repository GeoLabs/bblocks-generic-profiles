- key: topographic-position-index
  prefLabel: Topographic position index
  definition: 'The topographic position index (TPI) of Guisan et al. (1999): the difference between the
    elevation of each cell and the mean elevation of its neighbourhood.'
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
