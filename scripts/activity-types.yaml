- key: terrain-ruggedness-index
  prefLabel: Terrain ruggedness index
  definition: 'The terrain ruggedness index (TRI) of Riley et al. (1999): how much the elevation of each
    cell differs from that of its neighbourhood.'
  parent: geoprocessing
  usedEntityType:
  - geo:Feature
  generatedEntityType:
  - geo:Feature
  sources:
