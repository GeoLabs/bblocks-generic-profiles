    © Paul Ramsey, Mark Leslie, PostGIS contributors, licensed [CC BY-SA 3.0 US](http://creativecommons.org/licenses/by-sa/3.0/us/).'
- key: equals
  prefLabel: Equals
  altLabel:
  - ST_Equals
  definition: Returns TRUE if this geometric object is spatially equal to anotherGeometry (same point
